<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wingo Predictor</title>
<style>
  :root {
    --bg: #0f0f13;
    --card: #1a1a22;
    --border: #2a2a38;
    --lon: #ff4d6d;
    --nho: #4d9fff;
    --text: #e8e8f0;
    --muted: #6b6b88;
    --accent: #7c3aed;
    --win: #22c55e;
    --pad-top: env(safe-area-inset-top, 0px);
    --pad-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }
  body {
    padding-top: calc(var(--pad-top) + 16px);
    padding-bottom: calc(var(--pad-bot) + 16px);
    padding-left: 16px; padding-right: 16px;
    max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 14px;
  }

  h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: .05em; color: var(--text); }
  .subtitle { font-size: .75rem; color: var(--muted); margin-top: 2px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }

  /* ── Prediction box ── */
  .pred-box {
    text-align: center;
    padding: 20px 16px;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--card);
    transition: border-color .3s;
  }
  .pred-box.lon { border-color: var(--lon); }
  .pred-box.nho { border-color: var(--nho); }
  .pred-label {
    font-size: 2.6rem;
    font-weight: 900;
    letter-spacing: .08em;
    line-height: 1;
  }
  .pred-label.lon { color: var(--lon); }
  .pred-label.nho { color: var(--nho); }
  .pred-label.unknown { color: var(--muted); font-size: 1.8rem; }
  .pred-conf { font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .pred-method { font-size: .72rem; color: var(--accent); margin-top: 3px; }

  /* ── Stat bar ── */
  .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: .82rem; }
  .stat-bar-wrap { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .stat-bar-lon { height: 100%; background: var(--lon); border-radius: 99px; transition: width .4s; }
  .stat-labels { display: flex; justify-content: space-between; font-size: .72rem; margin-top: 4px; }
  .lon-text { color: var(--lon); font-weight: 700; }
  .nho-text { color: var(--nho); font-weight: 700; }

  /* ── History chips ── */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 4px 10px;
    border-radius: 99px;
    font-size: .75rem;
    font-weight: 700;
    border: 1px solid transparent;
  }
  .chip.lon { background: rgba(255,77,109,.15); color: var(--lon); border-color: rgba(255,77,109,.3); }
  .chip.nho { background: rgba(77,159,255,.15); color: var(--nho); border-color: rgba(77,159,255,.3); }

  /* ── Streak ── */
  .streak-row { display: flex; align-items: center; gap: 10px; font-size: .85rem; }
  .streak-count { font-size: 1.4rem; font-weight: 900; }
  .streak-warn { font-size: .72rem; color: #f59e0b; margin-top: 2px; }

  /* ── Input ── */
  .input-label { font-size: .8rem; color: var(--muted); margin-bottom: 10px; }
  .num-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .num-btn {
    aspect-ratio: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
    -webkit-tap-highlight-color: transparent;
  }
  .num-btn:active { transform: scale(.92); }
  .num-btn.lon { border-color: rgba(255,77,109,.4); }
  .num-btn.nho { border-color: rgba(77,159,255,.4); }
  .num-btn:hover { background: var(--border); }

  /* ── Action buttons ── */
  .action-row { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
    font-size: .82rem; font-weight: 600; cursor: pointer;
    background: var(--bg); color: var(--muted);
    transition: background .15s, color .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { opacity: .7; }
  .btn.danger { color: var(--lon); border-color: rgba(255,77,109,.3); }
  .btn.danger:hover { background: rgba(255,77,109,.1); }
  .btn.undo:hover { background: var(--border); color: var(--text); }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: calc(var(--pad-bot) + 20px); left: 50%; transform: translateX(-50%) translateY(20px);
    background: #2a2a38; color: var(--text); padding: 10px 20px;
    border-radius: 99px; font-size: .8rem; opacity: 0;
    transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .section-title { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
  .empty-note { font-size: .8rem; color: var(--muted); text-align: center; padding: 10px 0; }
</style>
</head>
<body>

<div>
  <h1>🎯 Wingo Predictor</h1>
  <div class="subtitle">Lớn (5–9) · Nhỏ (0–4) · lịch sử lưu local</div>
</div>

<!-- Prediction -->
<div class="pred-box" id="predBox">
  <div class="pred-label unknown" id="predLabel">?</div>
  <div class="pred-conf" id="predConf">Cần thêm 5 phiên để dự đoán</div>
  <div class="pred-method" id="predMethod"></div>
</div>

<!-- Stats -->
<div class="card">
  <div class="section-title">Thống kê</div>
  <div class="stat-row">
    <span class="lon-text" id="lonCount">LỚN 0</span>
    <span style="color:var(--muted);font-size:.75rem" id="totalCount">0 phiên</span>
    <span class="nho-text" id="nhoCount">NHỎ 0</span>
  </div>
  <div class="stat-bar-wrap">
    <div class="stat-bar-lon" id="statBar" style="width:50%"></div>
  </div>
  <div class="stat-labels">
    <span class="lon-text" id="lonPct">0%</span>
    <span class="nho-text" id="nhoPct">0%</span>
  </div>
</div>

<!-- Streak -->
<div class="card" id="streakCard">
  <div class="section-title">Streak</div>
  <div class="streak-row">
    <span class="streak-count" id="streakLabel" style="color:var(--muted)">—</span>
    <div>
      <div id="streakText" style="color:var(--muted);font-size:.82rem">chưa có dữ liệu</div>
      <div class="streak-warn" id="streakWarn"></div>
    </div>
  </div>
</div>

<!-- History chips -->
<div class="card">
  <div class="section-title">10 kết quả gần nhất</div>
  <div class="chips" id="chips">
    <div class="empty-note">Chưa có dữ liệu</div>
  </div>
</div>

<!-- Input -->
<div class="card">
  <div class="input-label">Nhập kết quả phiên vừa rồi:</div>
  <div class="num-grid" id="numGrid"></div>
</div>

<!-- Actions -->
<div class="action-row">
  <button class="btn undo" onclick="undo()">↩ Xoá cuối</button>
  <button class="btn danger" onclick="clearAll()">🗑 Xoá hết</button>
</div>

<div id="toast"></div>

<script>
// ── Storage ──────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'wingo_history';
const MIN_HISTORY = 5;
const WINDOW_SIZE = 20;

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveHistory(h) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); }
  catch(e) { toast('Lưu thất bại: ' + e.message); }
}

let history = loadHistory();

// ── Classify ─────────────────────────────────────────────────────────────────
function classify(n) { return n >= 5 ? 'LỚN' : 'NHỎ'; }

// ── Prediction engine ─────────────────────────────────────────────────────────
function predict(history) {
  if (history.length < MIN_HISTORY) return { pred: '?', conf: 0, method: '' };

  const labels = history.map(classify);
  const recent = labels.slice(-WINDOW_SIZE);

  // Method 1: 3-gram pattern
  if (labels.length >= 4) {
    const key = labels.slice(-3).join(',');
    const hits = { 'LỚN': 0, 'NHỎ': 0 };
    for (let i = 0; i <= labels.length - 4; i++) {
      if (labels.slice(i, i+3).join(',') === key) hits[labels[i+3]]++;
    }
    const total = hits['LỚN'] + hits['NHỎ'];
    if (total >= 3) {
      const pred = hits['LỚN'] >= hits['NHỎ'] ? 'LỚN' : 'NHỎ';
      const conf = (hits[pred] / total) * 100;
      if (conf >= 60) return { pred, conf: +conf.toFixed(1), method: '3-gram pattern' };
    }
  }

  // Method 2: window frequency + weighted recent
  const lonC = recent.filter(l => l === 'LỚN').length;
  const nhoC = recent.length - lonC;
  if (lonC !== nhoC) {
    const pred = lonC > nhoC ? 'NHỎ' : 'LỚN'; // regression to mean
    const domRatio = Math.max(lonC, nhoC) / recent.length;
    let conf = 50 + (domRatio - 0.5) * 60;
    conf = Math.min(conf, 78);

    if (recent.length >= 6) {
      const tail = recent.slice(-5);
      const tLon = tail.filter(l => l === 'LỚN').length;
      const tNho = tail.length - tLon;
      const wLon = tLon * 2 + lonC;
      const wNho = tNho * 2 + nhoC;
      const wTotal = wLon + wNho;
      const wPred = wLon > wNho ? 'NHỎ' : 'LỚN';
      const wConf = Math.min(50 + (Math.max(wLon,wNho)/wTotal - 0.5)*60, 78);
      if (wConf > conf) return { pred: wPred, conf: +wConf.toFixed(1), method: 'weighted recent' };
    }
    return { pred, conf: +conf.toFixed(1), method: 'window frequency' };
  }

  // Fallback
  const pred = Math.random() < .5 ? 'LỚN' : 'NHỎ';
  return { pred, conf: 50, method: 'fallback' };
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const labels = history.map(classify);
  const lonC = labels.filter(l => l === 'LỚN').length;
  const nhoC = labels.length - lonC;
  const total = labels.length;

  // Stats
  document.getElementById('lonCount').textContent = `LỚN ${lonC}`;
  document.getElementById('nhoCount').textContent = `NHỎ ${nhoC}`;
  document.getElementById('totalCount').textContent = `${total} phiên`;
  const lonPct = total ? (lonC/total*100) : 50;
  document.getElementById('statBar').style.width = lonPct + '%';
  document.getElementById('lonPct').textContent = total ? lonPct.toFixed(1)+'%' : '0%';
  document.getElementById('nhoPct').textContent = total ? (100-lonPct).toFixed(1)+'%' : '0%';

  // Chips
  const chipsEl = document.getElementById('chips');
  const recent10 = history.slice(-10);
  if (recent10.length === 0) {
    chipsEl.innerHTML = '<div class="empty-note">Chưa có dữ liệu</div>';
  } else {
    chipsEl.innerHTML = recent10.map(n => {
      const cls = classify(n);
      return `<span class="chip ${cls === 'LỚN' ? 'lon' : 'nho'}">${n} ${cls}</span>`;
    }).join('');
  }

  // Streak
  let streakCount = 0, streakLabel = '';
  if (labels.length) {
    streakLabel = labels[labels.length-1];
    for (let i = labels.length-1; i >= 0; i--) {
      if (labels[i] === streakLabel) streakCount++;
      else break;
    }
  }
  const streakLabelEl = document.getElementById('streakLabel');
  const streakTextEl  = document.getElementById('streakText');
  const streakWarnEl  = document.getElementById('streakWarn');
  if (streakLabel) {
    streakLabelEl.textContent = `×${streakCount}`;
    streakLabelEl.style.color = streakLabel === 'LỚN' ? 'var(--lon)' : 'var(--nho)';
    streakTextEl.textContent = streakLabel + ' liên tiếp';
    streakTextEl.style.color = streakLabel === 'LỚN' ? 'var(--lon)' : 'var(--nho)';
    streakWarnEl.textContent = streakCount >= 4 ? '⚠ Streak dài — có thể đảo chiều' : '';
  } else {
    streakLabelEl.textContent = '—';
    streakLabelEl.style.color = 'var(--muted)';
    streakTextEl.textContent = 'chưa có dữ liệu';
    streakTextEl.style.color = 'var(--muted)';
    streakWarnEl.textContent = '';
  }

  // Prediction
  const { pred, conf, method } = predict(history);
  const predBox   = document.getElementById('predBox');
  const predLabel = document.getElementById('predLabel');
  const predConf  = document.getElementById('predConf');
  const predMeth  = document.getElementById('predMethod');

  predBox.className = 'pred-box';
  if (pred === 'LỚN') {
    predBox.classList.add('lon');
    predLabel.className = 'pred-label lon';
    predLabel.textContent = 'LỚN';
    predConf.textContent = `Độ tin cậy: ${conf}%`;
    predMeth.textContent = method;
  } else if (pred === 'NHỎ') {
    predBox.classList.add('nho');
    predLabel.className = 'pred-label nho';
    predLabel.textContent = 'NHỎ';
    predConf.textContent = `Độ tin cậy: ${conf}%`;
    predMeth.textContent = method;
  } else {
    predLabel.className = 'pred-label unknown';
    predLabel.textContent = '?';
    const rem = MIN_HISTORY - history.length;
    predConf.textContent = `Cần thêm ${rem} phiên để dự đoán`;
    predMeth.textContent = '';
  }
}

// ── Number grid ───────────────────────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('numGrid');
  for (let i = 0; i <= 9; i++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn ' + (i >= 5 ? 'lon' : 'nho');
    btn.textContent = i;
    btn.onclick = () => addResult(i);
    grid.appendChild(btn);
  }
}

function addResult(n) {
  history.push(n);
  saveHistory(history);
  render();
  toast(`Đã lưu: ${n} (${classify(n)})`);
}

function undo() {
  if (!history.length) { toast('Lịch sử trống'); return; }
  const removed = history.pop();
  saveHistory(history);
  render();
  toast(`Đã xoá: ${removed} (${classify(removed)})`);
}

function clearAll() {
  if (!history.length) { toast('Lịch sử đã trống'); return; }
  if (!confirm('Xoá toàn bộ lịch sử?')) return;
  history = [];
  saveHistory(history);
  render();
  toast('Đã xoá toàn bộ');
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildGrid();
render();
</script>
</body>
</html>
